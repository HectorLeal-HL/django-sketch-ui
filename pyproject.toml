[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-sketch-ui"
version = "1.0.1"
description = "Un tema moderno para interfaces admin de Django"
readme = "README.md"
authors = [
    { name = "Hector Leal", email = "hectorhleal2005@gmail.com" }
]
license = "MIT"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "Django>=4.0"
]

[project.urls]
Homepage = "https://github.com/HectorLeal-HL/django-sketch-ui.git"
Repository = "https://github.com/HectorLeal-HL/django-sketch-ui.git"
Issues = "https://github.com/HectorLeal-HL/django-sketch-ui/issues"

[tool.setuptools]
packages = ["django_sketch_ui"]
include-package-data = true